[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mp-mcp"
version = "0.2.0"
description = "Materials Project MCP server generated from the MP API's own OpenAPI spec and the mp-api client"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "FORUM-AI development team", email = "FORUM-AI@lbl.gov" }]
dependencies = [
  "fastmcp>=3",
  "mp-api[contribs]>=0.47",
  "httpx",
  "matplotlib",
]

[project.scripts]
mp-mcp = "mp_mcp.server:main"

[project.optional-dependencies]
test = ["pytest", "pytest-asyncio"]

[tool.hatch.build.targets.wheel]
packages = ["src/mp_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
