name: Deploy MCP Connector

# Automatic redeployment on every push to main; workflow_dispatch keeps the
# manual "Run workflow" button available.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write   # required to request the OIDC token for role assumption
  contents: read

env:
  AWS_REGION: us-east-2
  STACK_NAME: scidac-forum-ai
  CLUSTER_NAME: scidac-forum-ai-cluster
  SERVICE_NAME: mcp-server-connector-service
  ECR_REPO_NAME: scidac-forum-ai-mcp-connector
  IMAGE_TAG: latest

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Assume the CloudFormation-created IAM role via OIDC.
      # AWS_ROLE_ARN is a repository variable holding the
      # GitHubActionsMCPConnectorDeployRoleArn stack output — no access keys.
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag and push MCP connector image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          IMAGE_URI="${ECR_REGISTRY}/scidac-forum-ai-mcp-connector:${IMAGE_TAG}"
          docker build --platform linux/amd64 -t "$IMAGE_URI" .
          docker push "$IMAGE_URI"
          echo "image_uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"

      - name: Force new ECS deployment of the MCP Connector
        run: |
          aws ecs update-service \
            --cluster "scidac-forum-ai-cluster" \
            --service "$SERVICE_NAME" \
            --force-new-deployment \
            --region "us-east-2"
          # services-stable also waits for old tasks to drain and caps at 10 min;
          # poll the new deployment's rollout state instead (up to 30 min).
          for i in $(seq 1 120); do
            STATE=$(aws ecs describe-services \
              --cluster "scidac-forum-ai-cluster" \
              --services "$SERVICE_NAME" \
              --region "us-east-2" \
              --query "services[0].deployments[?status=='PRIMARY'].rolloutState | [0]" \
              --output text)
            echo "[$i] rolloutState=$STATE"
            [ "$STATE" = "COMPLETED" ] && exit 0
            if [ "$STATE" = "FAILED" ]; then
              echo "::error::ECS deployment failed"
              exit 1
            fi
            sleep 15
          done
          echo "::error::Timed out waiting for ECS deployment"
          exit 1
